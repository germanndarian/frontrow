<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Frontrow</title>
    <!--
      Offline fallback. Capacitor requires a valid `webDir` even though the app
      loads the deployed site from `server.url`; this is what the WebView shows
      when it can't reach that origin. Standalone by design — no build step, no
      imports from src/. Colours are copied from the globals.css tokens rather
      than referenced, since nothing else here is loaded.
    -->
    <style>
      :root {
        --bg: #f1f1ec;
        --ink: #131313;
        --muted: #46464a;
        --line: #e6e5df;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: oklch(0.158 0.012 256);
          --ink: oklch(0.975 0.006 256);
          --muted: oklch(0.745 0.014 256);
          --line: oklch(0.3 0.018 256);
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 30ch; text-align: center; }
      .mark {
        width: 56px; height: 56px; margin: 0 auto 20px;
        border-radius: 14px; border: 1px solid var(--line);
        display: flex; align-items: center; justify-content: center;
        font-weight: 800; letter-spacing: -0.04em; font-size: 21px;
      }
      h1 { margin: 0 0 8px; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
      p { margin: 0; color: var(--muted); font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">FR</div>
      <h1>Can't reach Frontrow</h1>
      <p>You appear to be offline. Check your connection and reopen the app.</p>
    </main>
  </body>
</html>
