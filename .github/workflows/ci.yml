name: CI

# Quality gate for the codebase. Vercel handles deploys on push to main via its
# Git integration, so this workflow only lints, type-checks, tests, and builds.
# Runs on every pull request (any base branch) so faulty code can't merge.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium for the desktop app, WebKit for the phone layout — the engine
      # an iPhone actually runs, and the one that caught the CSP problem
      # Chromium waves through on localhost.
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      # Runs the demo dataset, so no ESPN and no Supabase: a red run here means
      # our code broke. The upstream contract suite is deliberately left out —
      # see .github/workflows/upstream.yml.
      - name: Browser tests
        run: npm run e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
