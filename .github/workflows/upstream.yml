name: Upstream watch

# Calls ESPN for real and checks the contract still holds.
#
# This is the alarm that was missing in September 2026, when ESPN stopped
# answering date ranges: 137 unit tests stayed green while the iOS Scores tab
# was dead, because nothing in CI ever talked to ESPN. Every other test we have
# runs on the bundled demo dataset and cannot fail when a third party changes.
#
# Deliberately NOT part of the merge gate. A failure here means "the contract
# moved, go look" — never "this pull request is bad". Someone else's outage
# must not be able to block a release.

on:
  schedule:
    # Twice a day, offset off the hour to avoid the cron stampede.
    - cron: "17 7,19 * * *"
  workflow_dispatch:

concurrency:
  group: upstream
  cancel-in-progress: true

jobs:
  contract:
    name: ESPN contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      # ESPN can have a bad minute without having changed its API, so one retry
      # separates a blip from a real break.
      - name: ESPN contract
        run: npm run e2e:upstream

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-report
          path: playwright-report/
          retention-days: 14
