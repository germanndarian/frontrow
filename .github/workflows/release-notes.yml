name: Release notes

# Publishes a release's notes to Notion (a page under "Release Notes"). Nobody
# has to start this: when CI goes green on main after a merge, the next version
# is worked out from the commits, tagged, and its page is added to Notion. Pushing a v* tag by hand publishes that version instead, and
# a manual run with dry_run prints what it would do without writing anything.

on:
  # A merge, once it has passed CI. A red main publishes nothing.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read everything and print what would change, without writing to Notion"
        type: boolean
        default: true
      tag:
        description: "Tag to publish notes for (default: the latest v* tag). A dry run can name a tag that doesn't exist yet to preview it at the current commit."
        type: string
        required: false

permissions:
  # To push the version tag it creates for a merge.
  contents: write

# One release at a time, so two merges landing together can't both claim
# "Latest" or pick the same version number.
concurrency:
  group: release-notes
  cancel-in-progress: false

jobs:
  notion:
    name: Publish to Notion
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The commit CI just tested — not whatever main has moved on to.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          # Every commit and tag, to find the previous release.
          fetch-depth: 0

      - name: Work out the next version
        id: next
        if: github.event_name == 'workflow_run'
        run: echo "tag=$(.github/scripts/next-version.sh)" >>"$GITHUB_OUTPUT"

      - name: Nothing to release
        if: github.event_name == 'workflow_run' && steps.next.outputs.tag == ''
        run: echo "No commits since the last version tag — nothing to publish."

      # Locally first: a failure in Notion leaves no tag behind, so re-running
      # the job publishes the same version again instead of skipping it.
      - name: Tag the release
        if: steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: git tag "$TAG"

      - name: Publish release notes
        if: github.event_name != 'workflow_run' || steps.next.outputs.tag != ''
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # Optional: pin the pages by id if looking them up by name ever finds the wrong one.
          NOTION_NOTES_PAGE_ID: ${{ vars.NOTION_NOTES_PAGE_ID }}
          NOTION_TEMPLATE_PAGE_ID: ${{ vars.NOTION_TEMPLATE_PAGE_ID }}
          TAG: ${{ steps.next.outputs.tag || (github.event_name == 'push' && github.ref_name) || inputs.tag }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: bash .github/scripts/notion-release-notes.sh

      - name: Push the tag
        if: steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: git push origin "refs/tags/$TAG"
