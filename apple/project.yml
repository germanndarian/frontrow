name: Frontrow
options:
  bundleIdPrefix: com.germanndarian
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.6"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  Frontrow:
    type: application
    platform: iOS
    sources:
      - path: Frontrow
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.germanndarian.frontrow
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_CFBundleDisplayName: Frontrow
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  FrontrowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FrontrowUITests
    dependencies:
      - target: Frontrow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.germanndarian.frontrow.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Frontrow
schemes:
  Frontrow:
    build:
      targets:
        Frontrow: all
        FrontrowUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FrontrowUITests
